<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MajorStockX · Sem internet</title>
<style>
  :root { color-scheme: light dark; --bg:#ffffff; --fg:#111827; --muted:#6b7280; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e5e7eb; --muted:#9ca3af; --accent:#60a5fa; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:24px; box-sizing:border-box; }
  main { max-width:380px; text-align:center; }
  h1 { font-size:1.4rem; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 20px; }
  button { font:inherit; font-weight:600; background:var(--accent); color:#fff; border:0; border-radius:12px; padding:12px 24px; }
</style>
</head>
<body>
<main>
  <h1>Sem ligação à internet</h1>
  <p>Esta página ainda não ficou guardada neste aparelho. Ligue-se à internet e tente de novo — o que já abriu antes continua disponível.</p>
  <button onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
